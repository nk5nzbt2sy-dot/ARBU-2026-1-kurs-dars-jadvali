<style>
  :root{
    --bg:#0F2148;
    --card:#1B3462;
    --card-2:#0C1B3A;
    --line:#4D6BB5;
    --gold:#D8B24A;
    --gold-soft:rgba(216,178,74,0.35);
    --ink:#F1ECDC;
    --ink-soft:#93A0C4;
    --burgundy:#C0605C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B1836; --card:#162B54; --card-2:#08132C; --line:#4E67A3;
      --gold:#E0BC5C; --ink:#F1ECDC; --ink-soft:#8E9BC0; --burgundy:#CB6B67;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B1836; --card:#162B54; --card-2:#08132C; --line:#4E67A3;
    --gold:#E0BC5C; --ink:#F1ECDC; --ink-soft:#8E9BC0; --burgundy:#CB6B67;
  }
  *{box-sizing:border-box;}
  html,body{ background:var(--bg); }
  body{
    margin:0; color:var(--ink);
    font-family:'PT Sans', -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{ max-width:460px; margin:0 auto; padding:26px 18px 40px; }

  /* ---- brand header ---- */
  .brand{ text-align:center; margin-bottom:18px; position:relative; }
  .brand-logo{
    width:92px; height:92px; object-fit:contain; display:block; margin:0 auto 8px;
    animation:logoIn 1700ms cubic-bezier(.16,1,.3,1) both;
    filter:drop-shadow(0 0 0 var(--gold-soft));
    animation-name: logoIn, logoGlow;
    animation-duration: 1700ms, 6400ms;
    animation-timing-function: cubic-bezier(.16,1,.3,1), ease-in-out;
    animation-iteration-count: 1, infinite;
    animation-delay: 0ms, 1700ms;
  }
  @keyframes logoIn{ from{ opacity:0; transform:scale(.92) rotate(-2deg);} to{ opacity:1; transform:scale(1) rotate(0);} }
  @keyframes logoGlow{
    0%,100%{ filter:drop-shadow(0 0 2px var(--gold-soft)); }
    50%{ filter:drop-shadow(0 0 10px var(--gold-soft)); }
  }
  @media (prefers-reduced-motion: reduce){
    .brand-logo{ animation:none; }
  }
  .brand-title{ font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:1.05rem; color:var(--ink); margin:0; }
  .brand-sub{ font-size:0.76rem; color:var(--ink-soft); margin:2px 0 0; letter-spacing:0.02em; }
  #switchBtn{
    position:absolute; top:0; right:0;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    font-family:'PT Sans', sans-serif; font-size:0.74rem; padding:11px 14px;
    min-height:44px; display:inline-flex; align-items:center;
    border-radius:20px; cursor:pointer; transition:transform 220ms ease, border-color 220ms ease;
  }
  #switchBtn:active{ transform:scale(0.94); }
  @media (hover:hover) and (pointer:fine){
    #switchBtn:hover{ transform:scale(1.08); border-color:var(--gold); color:var(--gold); cursor:pointer; }
  }

  h1{ font-family:'PT Serif', Georgia, 'Times New Roman', serif; font-weight:700; font-size:1.9rem; line-height:1.1; margin:0 0 2px; }
  .date{ font-size:0.9rem; color:var(--ink-soft); margin:0 0 20px; }

  .hero{
    background:var(--card-2); color:var(--ink); border:1px solid var(--gold);
    border-radius:12px; padding:18px 18px 20px; margin-bottom:22px;
    animation:heroIn 750ms cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes heroIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .hero{ animation:none; } }
  .hero .status-label{ display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--gold); margin-bottom:8px; }
  .dot-live{ width:7px;height:7px;border-radius:50%; background:var(--gold); animation:pulse 3.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .dot-live{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .hero .subject{ font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:1.26rem; line-height:1.25; margin:0 0 8px; }
  .hero .meta{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.9rem; color:var(--ink); opacity:0.85; gap:10px; }
  .hero .meta .time{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--gold); }
  .hero .plain{ font-family:'PT Serif', Georgia, serif; font-style:italic; font-weight:400; font-size:1.12rem; line-height:1.35; margin:0; }

  .tabs{ display:flex; gap:4px; margin-bottom:22px; }
  .tab{
    flex:1; padding:14px 2px; min-height:44px; text-align:center; background:transparent;
    border:1px solid var(--line); border-radius:7px; color:var(--ink-soft);
    font-family:'PT Sans', sans-serif; font-size:0.82rem; font-weight:400;
    cursor:pointer; position:relative; transition:transform 200ms ease, background-color 260ms ease, color 260ms ease, border-color 260ms ease;
  }
  .tab:active{ transform:scale(0.94); }
  .tab.today::after{ content:""; position:absolute; bottom:4px; left:50%; width:4px; height:4px; border-radius:50%; background:var(--gold); transform:translateX(-50%); }
  .tab.selected{ background:var(--gold); color:var(--card-2); border-color:var(--gold); font-weight:600; }
  .tab.selected.today::after{ background:var(--card-2); }
  .tab:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  @media (hover:hover) and (pointer:fine){
    .tab{ cursor:pointer; }
    .tab:hover{ transform:scale(1.09); border-color:var(--gold); color:var(--ink); }
    .tab.selected:hover{ transform:scale(1.09); }
  }

  .day-heading{ font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:1.12rem; margin:0 0 14px; }

  #dayBody{ animation:fadeSwap 420ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes fadeSwap{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ #dayBody{ animation:none; } }

  .timeline{ list-style:none; margin:0; padding-left:20px; border-left:2px solid var(--line); }
  .item{ position:relative; padding-bottom:24px; }
  .item:last-child{ padding-bottom:0; }
  .item::before{ content:""; position:absolute; left:-26px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--bg); }
  .item.now::before{ width:14px; height:14px; left:-28px; top:2px; background:var(--burgundy); }
  .item .time{ font-variant-numeric:tabular-nums; font-size:0.82rem; color:var(--ink-soft); margin-bottom:3px; }
  .item .subject{ font-size:1.02rem; font-weight:400; line-height:1.3; margin-bottom:6px; }
  .pill{ display:inline-block; font-size:0.72rem; color:var(--gold); border:1px solid var(--gold); border-radius:20px; padding:1px 8px; margin-left:8px; vertical-align:middle; }
  .item .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:0.88rem; color:var(--ink-soft); }
  .badge{ background:var(--card); border:1px solid var(--line); border-radius:6px; padding:2px 8px; font-size:0.8rem; color:var(--ink); white-space:nowrap; }

  .selfstudy-card, .empty-card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; font-size:0.98rem; color:var(--ink-soft); }
  .selfstudy-card b{ color:var(--ink); font-weight:700; }

  footer{ margin-top:30px; font-size:0.78rem; color:var(--ink-soft); border-top:1px solid var(--line); padding-top:12px; }

  .picker-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:24px 20px; margin-top:6px;
    animation:heroIn 750ms cubic-bezier(.16,1,.3,1) both;
  }
  @media (prefers-reduced-motion: reduce){ .picker-card{ animation:none; } }
  .picker-card h2{ font-family:'PT Serif', Georgia, serif; font-weight:700; font-size:1.25rem; margin:0 0 6px; color:var(--ink); }
  .picker-card p{ font-size:0.9rem; color:var(--ink-soft); margin:0 0 18px; }
  select#groupSelect{
    width:100%; padding:12px 12px; font-size:1rem; font-family:'PT Sans', sans-serif;
    background:var(--card-2); color:var(--ink); border:1px solid var(--line); border-radius:8px;
    transition:border-color 220ms ease, transform 220ms ease;
  }
  @media (hover:hover) and (pointer:fine){
    select#groupSelect:hover{ border-color:var(--gold); cursor:pointer; }
  }

const DAYS = ["Dush","Sesh","Chor","Pay","Jum","Shan"];
const DAY_FULL = {Dush:"Dushanba",Sesh:"Seshanba",Chor:"Chorshanba",Pay:"Payshanba",Jum:"Juma",Shan:"Shanba"};
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const STORAGE_KEY = "arbu_selected_group";

let currentGroup = null;
let selectedDay = jsDayToKey(new Date().getDay()) || 'Dush';

function parseTime(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function jsDayToKey(jsDay){ return {1:'Dush',2:'Sesh',3:'Chor',4:'Pay',5:'Jum',6:'Shan',0:null}[jsDay]; }
function fmtMins(mins){ return mins + " daqiqa"; }

function naturalNum(code){
  const m = code.match(/(\d+)(?!.*\d)/);
  return m ? parseInt(m[1],10) : 0;
}

function retrigger(el){
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function buildPicker(){
  const sel = document.getElementById('groupSelect');
  const byFaculty = {};
  Object.keys(DATA).forEach(code=>{
    const fac = DATA[code].faculty;
    (byFaculty[fac] = byFaculty[fac] || []).push(code);
  });
  const optDefault = document.createElement('option');
  optDefault.value = ""; optDefault.textContent = "— tanlang —"; optDefault.disabled = true; optDefault.selected = true;
  sel.appendChild(optDefault);
  Object.keys(byFaculty).forEach(fac=>{
    byFaculty[fac].sort((a,b)=>naturalNum(a)-naturalNum(b));
    const og = document.createElement('optgroup');
    og.label = fac;
    byFaculty[fac].forEach(code=>{
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = code + "-guruh";
      og.appendChild(opt);
    });
    sel.appendChild(og);
  });
  sel.addEventListener('change', ()=>{
    if(sel.value){ selectGroup(sel.value); }
  });
}

function selectGroup(code){
  if(!DATA[code]) return;
  currentGroup = code;
  try{ localStorage.setItem(STORAGE_KEY, code); }catch(e){}
  document.title = code + "-guruh — dars jadvali";
  try{
    const url = new URL(window.location.href);
    url.searchParams.set('g', code);
    window.history.replaceState({}, '', url);
  }catch(e){}
  document.getElementById('pickerScreen').classList.add('hidden');
  document.getElementById('scheduleScreen').classList.remove('hidden');
  document.getElementById('switchBtn').classList.remove('hidden');
  selectedDay = jsDayToKey(new Date().getDay()) || 'Dush';
  renderAll();
}

function showPicker(){
  document.title = "ARBU 1-kurs — dars jadvali";
  document.getElementById('scheduleScreen').classList.add('hidden');
  document.getElementById('switchBtn').classList.add('hidden');
  document.getElementById('pickerScreen').classList.remove('hidden');
  retrigger(document.getElementById('pickerScreen'));
  document.getElementById('groupSelect').value = "";
}

function computeStatus(){
  const now = new Date();
  const jsDay = now.getDay();
  const minutesNow = now.getHours()*60+now.getMinutes();
  const key = jsDayToKey(jsDay);
  if(!key){ return {type:'off'}; }
  const dayData = DATA[currentGroup].days[key];
  if(dayData.selfstudy){ return {type:'selfstudy'}; }
  const entries = dayData.entries;
  if(entries.length===0){ return {type:'noclasses'}; }
  for(const c of entries){
    const s=parseTime(c.start), e=parseTime(c.end);
    if(minutesNow>=s && minutesNow<e){ return {type:'now', cls:c, minsLeft:e-minutesNow}; }
  }
  const next = entries.find(c=>parseTime(c.start)>minutesNow);
  if(next){ return {type:'next', cls:next, minsUntil:parseTime(next.start)-minutesNow}; }
  return {type:'done'};
}

function renderHero(){
  const hero = document.getElementById('hero');
  const st = computeStatus();
  let html = "";
  if(st.type==='off'){
    html = `<p class="hero plain">Bugun — Yakshanba. Darslar yo'q, dam olish kuni.</p>`;
  } else if(st.type==='selfstudy'){
    html = `<p class="hero plain">Bugun — kun bo'yi mustaqil ta'lim.</p>`;
  } else if(st.type==='noclasses'){
    html = `<p class="hero plain">Bugun bu guruh uchun dars belgilanmagan.</p>`;
  } else if(st.type==='now'){
    html = `
      <div class="status-label"><span class="dot-live"></span>hozirgi dars</div>
      <p class="subject">${st.cls.subject}${st.cls.note?`<span class="pill">${st.cls.note}</span>`:""}</p>
      <div class="meta"><span>${st.cls.teacher||""}${st.cls.teacher&&st.cls.room?" · ":""}${st.cls.room||""}</span><span class="time">tugashiga ${fmtMins(st.minsLeft)}</span></div>
    `;
  } else if(st.type==='next'){
    html = `
      <div class="status-label">keyingi dars</div>
      <p class="subject">${st.cls.subject}${st.cls.note?`<span class="pill">${st.cls.note}</span>`:""}</p>
      <div class="meta"><span>${st.cls.teacher||""}${st.cls.teacher&&st.cls.room?" · ":""}${st.cls.room||""}</span><span class="time">${st.cls.start} da &middot; ${fmtMins(st.minsUntil)}dan so'ng</span></div>
    `;
  } else {
    html = `<p class="hero plain">Bugungi darslar tugadi.</p>`;
  }
  hero.innerHTML = html;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  const todayKey = jsDayToKey(new Date().getDay());
  tabs.innerHTML = "";
  DAYS.forEach(key=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', key===selectedDay ? 'true' : 'false');
    btn.className = 'tab' + (key===selectedDay?' selected':'') + (key===todayKey?' today':'');
    btn.textContent = key;
    btn.addEventListener('click', ()=>{ selectedDay = key; renderAll(); });
    tabs.appendChild(btn);
  });
}

function renderDay(){
  document.getElementById('dayHeading').textContent = DAY_FULL[selectedDay];
  const body = document.getElementById('dayBody');
  const todayKey = jsDayToKey(new Date().getDay());
  const now = new Date();
  const minutesNow = now.getHours()*60+now.getMinutes();

  const dayData = DATA[currentGroup].days[selectedDay];
  let innerHtml = "";

  if(dayData.selfstudy){
    innerHtml = `<div class="selfstudy-card">Bu kuni darslar jadvalda belgilanmagan — <b>kun bo'yi mustaqil ta'lim</b>ga ajratilgan.</div>`;
  } else if(dayData.entries.length===0){
    innerHtml = `<div class="empty-card">Bu kuni bu guruh uchun dars yo'q.</div>`;
  } else {
    const items = dayData.entries.map(c=>{
      const isNow = selectedDay===todayKey && minutesNow>=parseTime(c.start) && minutesNow<parseTime(c.end);
      return `<li class="item${isNow?' now':''}">
        <div class="time">${c.start}–${c.end}</div>
        <p class="subject">${c.subject}${c.note?`<span class="pill">${c.note}</span>`:""}</p>
        <div class="row"><span>${c.teacher||""}</span>${c.room?`<span class="badge">${c.room}</span>`:""}</div>
      </li>`;
    }).join("");
    innerHtml = `<ul class="timeline">${items}</ul>`;
  }
  body.innerHTML = innerHtml;
  retrigger(body);
}

function renderHeader(){
  const now = new Date();
  const todayKey = jsDayToKey(now.getDay());
  document.getElementById('todayName').textContent = todayKey ? DAY_FULL[todayKey] : "Yakshanba";
  document.getElementById('todayDate').textContent = `${now.getDate()}-${MONTHS[now.getMonth()]}`;
}

function renderAll(){
  if(!currentGroup) return;
  renderHeader();
  renderHero();
  retrigger(document.getElementById('hero'));
  renderTabs();
  renderDay();
}

buildPicker();
document.getElementById('switchBtn').addEventListener('click', showPicker);

let saved = null;
try{ saved = localStorage.getItem(STORAGE_KEY); }catch(e){}

let fromUrl = null;
try{
  const params = new URLSearchParams(window.location.search);
  const g = params.get('g');
  if(g && DATA[g]) fromUrl = g;
}catch(e){}

const initial = fromUrl || saved;
if(initial && DATA[initial]){
  document.getElementById('groupSelect').value = initial;
  selectGroup(initial);
} else {
  showPicker();
}

setInterval(()=>{ if(currentGroup) renderAll(); }, 30000);
</script>
